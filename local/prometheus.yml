global:
  scrape_interval: 15s
  evaluation_interval: 15s

# The same rules that run in the cluster, extracted from the PrometheusRule by
# `make local-up`.
rule_files:
  - /etc/prometheus/rules/platform.yaml

scrape_configs:
  # Compose scales the consumer to two replicas; DNS returns both.
  - job_name: orders-consumer
    dns_sd_configs:
      - names: [orders-consumer]
        type: A
        port: 8080
    relabel_configs:
      - target_label: namespace
        replacement: local
      - target_label: service
        replacement: orders-consumer
