apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-consumer
  labels:
    app.kubernetes.io/name: orders-consumer
    team: payments
automountServiceAccountToken: false
---
# Ingress: only Prometheus may scrape. Egress: DNS, Kafka, and the OTel collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-consumer
  labels:
    app.kubernetes.io/name: orders-consumer
    team: payments
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders-consumer
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4318
          protocol: TCP
    - ports:
        # Kafka brokers: plaintext, TLS, SASL/SCRAM and IAM listeners (MSK)
        - port: 9092
          protocol: TCP
        - port: 9094
          protocol: TCP
        - port: 9096
          protocol: TCP
        - port: 9098
          protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-consumer
  labels:
    app.kubernetes.io/name: orders-consumer
    team: payments
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-consumer
