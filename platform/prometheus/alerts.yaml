# Platform alerts. Every alert links to a runbook in src/paved/runbooks, and a test
# keeps the two in sync in both directions (no alert without a runbook, no runbook
# that claims an alert which does not exist).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paved-road-platform
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: paved-road.slo.recording
      interval: 30s
      rules:
        # Share of messages dead lettered, per topic. SLO: 99.9% handled over 30 days.
        - record: paved:consumer_error_ratio:rate5m
          expr: |
            sum by (namespace, topic) (rate(messages_processed_total{outcome="dead_letter"}[5m]))
            / sum by (namespace, topic) (rate(messages_processed_total[5m]))
        - record: paved:consumer_error_ratio:rate30m
          expr: |
            sum by (namespace, topic) (rate(messages_processed_total{outcome="dead_letter"}[30m]))
            / sum by (namespace, topic) (rate(messages_processed_total[30m]))
        - record: paved:consumer_error_ratio:rate1h
          expr: |
            sum by (namespace, topic) (rate(messages_processed_total{outcome="dead_letter"}[1h]))
            / sum by (namespace, topic) (rate(messages_processed_total[1h]))
        - record: paved:consumer_error_ratio:rate6h
          expr: |
            sum by (namespace, topic) (rate(messages_processed_total{outcome="dead_letter"}[6h]))
            / sum by (namespace, topic) (rate(messages_processed_total[6h]))

    - name: paved-road.kafka-consumers
      rules:
        - alert: KafkaConsumerLagHigh
          expr: |
            sum by (namespace, consumergroup, topic) (kafka_consumer_lag) > 10000
            and sum by (namespace, consumergroup, topic) (deriv(kafka_consumer_lag[10m])) > 0
          for: 10m
          labels:
            severity: page
          annotations:
            summary: "{{ $labels.consumergroup }} is {{ $value | humanize }} messages behind on {{ $labels.topic }} and falling further behind"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/kafka-consumer-lag.md

        - alert: KafkaConsumerStalled
          expr: |
            label_replace(
              time() - max by (namespace, service) (consumer_last_poll_timestamp_seconds) > 120,
              "consumergroup", "$1", "service", "(.*)"
            )
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "{{ $labels.service }} has not polled Kafka for {{ $value | humanizeDuration }}"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/kafka-consumer-lag.md

        - alert: DeadLetterMessagesIncreasing
          expr: sum by (namespace, topic, reason) (increase(dead_letter_messages_total[15m])) > 10
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "{{ $value | humanize }} messages from {{ $labels.topic }} dead lettered in 15m ({{ $labels.reason }})"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/dead-letter-growth.md

        # Multi window, multi burn rate alerts (Google SRE workbook, chapter 5).
        - alert: ConsumerErrorBudgetBurnFast
          expr: |
            paved:consumer_error_ratio:rate1h > (14.4 * 0.001)
            and paved:consumer_error_ratio:rate5m > (14.4 * 0.001)
          for: 2m
          labels:
            severity: page
          annotations:
            summary: "{{ $labels.topic }} is burning its error budget 14x too fast"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/error-budget-burn.md

        - alert: ConsumerErrorBudgetBurnSlow
          expr: |
            paved:consumer_error_ratio:rate6h > (6 * 0.001)
            and paved:consumer_error_ratio:rate30m > (6 * 0.001)
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "{{ $labels.topic }} is burning its error budget 6x too fast"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/error-budget-burn.md

    - name: paved-road.kubernetes
      rules:
        - alert: PodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/pod-crashloop.md

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Node {{ $labels.node }} has been NotReady for 5 minutes"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/node-not-ready.md

    - name: paved-road.ci-runners
      rules:
        # Metrics come from the ARC listener for each runner scale set.
        - alert: GitHubRunnerJobsQueued
          expr: |
            sum by (namespace, name) (gha_assigned_jobs)
            - sum by (namespace, name) (gha_running_jobs) > 0
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "{{ $value }} jobs waiting for a runner in scale set {{ $labels.name }}"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/gha-runner-backlog.md

        - alert: GitHubRunnerStartupSlow
          expr: |
            histogram_quantile(0.95,
              sum by (namespace, name, le) (rate(gha_job_startup_duration_seconds_bucket[30m]))
            ) > 120
          for: 30m
          labels:
            severity: ticket
          annotations:
            summary: "p95 job startup on {{ $labels.name }} is {{ $value | humanizeDuration }}"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/gha-runner-backlog.md

    - name: paved-road.observability
      rules:
        - alert: OtelCollectorExportFailing
          expr: sum by (exporter) (rate(otelcol_exporter_send_failed_spans_total[5m])) > 0
          for: 10m
          labels:
            severity: ticket
          annotations:
            summary: "Collector exporter {{ $labels.exporter }} is failing to send spans"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/otel-collector-dropping.md

        - alert: OtelCollectorRefusingData
          expr: sum by (receiver) (rate(otelcol_receiver_refused_spans_total[5m])) > 0
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: "Collector receiver {{ $labels.receiver }} is refusing spans (memory limiter)"
            runbook_url: https://github.com/pragathigopal7/paved-road/blob/main/src/paved/runbooks/otel-collector-dropping.md
