version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories: ["/", "/infra/pulumi"]
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: ["/infra/terraform/bootstrap", "/infra/terraform/platform"]
    schedule:
      interval: monthly
