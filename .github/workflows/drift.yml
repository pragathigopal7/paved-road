# Nightly drift detection: plan every environment and open (or update) an issue when
# the real infrastructure no longer matches main. Skipped until AWS is configured.
name: drift

on:
  schedule:
    - cron: "17 13 * * 1-5" # weekdays, early morning Pacific
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: paved-platform
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      contents: read
      id-token: write
      issues: write
    defaults:
      run:
        working-directory: infra/terraform/platform
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-west-2
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.x"
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="env/${{ matrix.environment }}.backend.hcl"
      - name: Plan with detailed exit code (0 clean, 2 drift)
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -no-color \
            -var-file="env/${{ matrix.environment }}.tfvars" > plan.txt
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 1 ] && exit 1 || exit 0
      - name: Open or update the drift issue
        if: steps.plan.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Infrastructure drift in ${{ matrix.environment }}"
        run: |
          gh label create drift --color B60205 --description "Infrastructure differs from main" --force
          body="$(printf 'Nightly plan found changes not in main.\n\n```\n%s\n```\n' "$(grep -E '^  [#~+-]|Plan:' plan.txt | head -100)")"
          existing="$(gh issue list --state open --label drift --search "$TITLE in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --label drift --body "$body"
          fi
